<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Meridian</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between antialiased p-4">

  <!-- Contenedor Principal -->
  <div class="max-w-md mx-auto w-full bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-5 my-auto">
    
    <!-- Encabezado -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold tracking-tight text-white">Calculadora Meridian</h1>
      <p class="text-xs text-slate-400 mt-1">Herramienta de cubetaje y rendimiento en mostrador</p>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 mb-6">
      <button id="tabPintura" onclick="switchTab('pintura')" class="py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 bg-blue-600 text-white shadow-md">
        Pintura
      </button>
      <button id="tabImper" onclick="switchTab('imper')" class="py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white">
        Impermeabilizante
      </button>
    </div>

    <!-- ================= SECCIÓN PINTURA ================= -->
    <div id="sectionPintura" class="space-y-4">
      
      <!-- Dimensiones -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Por Dimensiones de Pared (m):</label>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="pAncho" placeholder="Ancho (m)" oninput="calcAreaPintura()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
          <input type="number" id="pAlto" placeholder="Alto (m)" oninput="calcAreaPintura()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <!-- Área Directa -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">O Área Total de Superficie (m²):</label>
        <input type="number" id="pArea" placeholder="Ej. 90" oninput="clearPinturaDims()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
      </div>

      <!-- Selector de Línea Real Meridian -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Línea de Pintura Meridian:</label>
        <select id="lineaPintura" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
          <option value="premier">Meridian Premier (152 - 171 m² / Cubeta)</option>
          <option value="plus">Meridian Plus (133 - 152 m² / Cubeta)</option>
          <option value="clasica" selected>Meridian Clásica (114 - 133 m² / Cubeta)</option>
        </select>
      </div>

      <!-- Botón Calcular -->
      <button onclick="calcularPintura()" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-600/20 transition-all text-sm mt-2">
        Calcular Pintura
      </button>

      <!-- Tarjeta de Resultados -->
      <div id="resPinturaCard" class="hidden bg-slate-950/80 border border-slate-800 rounded-xl p-4 mt-4 space-y-2">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Material de Pintura Requerido</h3>
        <div id="resPinturaCont" class="text-sm"></div>
      </div>
    </div>

    <!-- ================= SECCIÓN IMPERMEABILIZANTE ================= -->
    <div id="sectionImper" class="hidden space-y-4">
      
      <!-- Dimensiones -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Por Dimensiones de Azotea (m):</label>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="iLargo" placeholder="Largo (m)" oninput="calcAreaImper()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
          <input type="number" id="iAncho" placeholder="Ancho (m)" oninput="calcAreaImper()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
        </div>
      </div>

      <!-- Área Directa -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">O Área Total de Azotea (m²):</label>
        <input type="number" id="iArea" placeholder="Ej. 100" oninput="clearImperDims()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 transition">
      </div>

      <!-- Selector de Producto Imper -->
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Línea Impermeabilizante:</label>
        <select id="lineaImper" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-blue-500 transition">
          <option value="3">Meridian 3 Años (19 m² / Cubeta 19L a 2 manos)</option>
          <option value="5">Meridian 5 Años (19 m² / Cubeta 19L a 2 manos)</option>
          <option value="7">Meridian 7 Años (19 m² / Cubeta 19L a 2 manos)</option>
        </select>
      </div>

      <!-- Opciones adicionales -->
      <div class="space-y-2 pt-1">
        <label class="flex items-center space-x-3 text-xs text-slate-300 cursor-pointer">
          <input type="checkbox" id="incSellador" checked class="w-4 h-4 rounded border-slate-700 bg-slate-950 text-blue-600 focus:ring-blue-500">
          <span>Incluir Sellador Acrílico (19L rinde 95 m²)</span>
        </label>
        <label class="flex items-center space-x-3 text-xs text-slate-300 cursor-pointer">
          <input type="checkbox" id="incMalla" checked class="w-4 h-4 rounded border-slate-700 bg-slate-950 text-blue-600 focus:ring-blue-500">
          <span>Incluir Malla de Refuerzo (+10% traslape)</span>
        </label>
      </div>

      <!-- Botón Calcular -->
      <button onclick="calcularImper()" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-600/20 transition-all text-sm mt-2">
        Calcular Sistema Impermeable
      </button>

      <!-- Tarjeta de Resultados -->
      <div id="resImperCard" class="hidden bg-slate-950/80 border border-slate-800 rounded-xl p-4 mt-4 space-y-2">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Desglose de Sistema Impermeable</h3>
        <div id="resImperCont" class="text-sm"></div>
      </div>
    </div>
  </div>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    // Cambiar entre pestañas
    function switchTab(tab) {
      const btnPintura = document.getElementById('tabPintura');
      const btnImper = document.getElementById('tabImper');
      const secPintura = document.getElementById('sectionPintura');
      const secImper = document.getElementById('sectionImper');

      if (tab === 'pintura') {
        btnPintura.className = "py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 bg-blue-600 text-white shadow-md";
        btnImper.className = "py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white";
        secPintura.classList.remove('hidden');
        secImper.classList.add('hidden');
      } else {
        btnImper.className = "py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 bg-blue-600 text-white shadow-md";
        btnPintura.className = "py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-400 hover:text-white";
        secImper.classList.remove('hidden');
        secPintura.classList.add('hidden');
      }
    }

    // Helpers de multiplicación de área Pintura
    function calcAreaPintura() {
      const ancho = parseFloat(document.getElementById('pAncho').value) || 0;
      const alto = parseFloat(document.getElementById('pAlto').value) || 0;
      if (ancho > 0 && alto > 0) {
        document.getElementById('pArea').value = (ancho * alto).toFixed(2);
      }
    }
    function clearPinturaDims() {
      document.getElementById('pAncho').value = '';
      document.getElementById('pAlto').value = '';
    }

    // Helpers de multiplicación de área Impermeabilizante
    function calcAreaImper() {
      const largo = parseFloat(document.getElementById('iLargo').value) || 0;
      const ancho = parseFloat(document.getElementById('iAncho').value) || 0;
      if (largo > 0 && ancho > 0) {
        document.getElementById('iArea').value = (largo * ancho).toFixed(2);
      }
    }
    function clearImperDims() {
      document.getElementById('iLargo').value = '';
      document.getElementById('iAncho').value = '';
    }

    // Rendimientos en m² cubiertos a 2 manos por empaque
    const RENDIMIENTOS_PINTURA = {
      premier: { nombre: "Meridian Premier", cubeta: 160, galon: 33.6, litro: 8.4 },
      plus: { nombre: "Meridian Plus", cubeta: 140, galon: 29.4, litro: 7.4 },
      clasica: { nombre: "Meridian Clásica", cubeta: 120, galon: 26, litro: 6.5 }
    };

    // Algoritmo de desglose de empaques optimizado para Pintura
    function calcularPintura() {
      const area = parseFloat(document.getElementById('pArea').value) || 0;
      const lineaKey = document.getElementById('lineaPintura').value;
      const card = document.getElementById('resPinturaCard');
      const cont = document.getElementById('resPinturaCont');

      if (area <= 0) {
        alert('Por favor ingresa un área válida.');
        return;
      }

      const linea = RENDIMIENTOS_PINTURA[lineaKey];
      let m2Restantes = area;

      // 1. Cubetas de 19L
      let cubetas = Math.floor(m2Restantes / linea.cubeta);
      m2Restantes %= linea.cubeta;

      if (m2Restantes >= linea.galon * 3.5) {
        cubetas += 1;
        m2Restantes = 0;
      }

      // 2. Galones de 4L
      let galones = 0;
      if (m2Restantes > 0) {
        galones = Math.floor(m2Restantes / linea.galon);
        m2Restantes %= linea.galon;

        if (m2Restantes >= linea.litro * 3) {
          galones += 1;
          m2Restantes = 0;
        }
      }

      // 3. Litros puros (1L)
      let litros = 0;
      if (m2Restantes > 0) {
        litros = Math.ceil(m2Restantes / linea.litro);
      }

      // Armar string de presentación
      let empaquesStr = [];
      if (cubetas > 0) empaquesStr.push(`<span class="font-bold text-emerald-400">${cubetas} Cubeta(s) 19L</span>`);
      if (galones > 0) empaquesStr.push(`<span class="font-bold text-emerald-400">${galones} Galón(es) 4L</span>`);
      if (litros > 0) empaquesStr.push(`<span class="font-bold text-emerald-400">${litros} Bote(s) 1L</span>`);

      cont.innerHTML = `
        <p class="text-xs text-slate-400 mb-1">Línea seleccionada: <span class="text-white font-medium">${linea.nombre}</span></p>
        <p class="text-xs text-slate-400 mb-3">Área total: <span class="text-white font-medium">${area} m²</span> (a 2 manos)</p>
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 space-y-1 text-sm">
          <p class="text-xs text-slate-400 font-semibold mb-1">Presentación sugerida:</p>
          <p>${empaquesStr.join(' + ')}</p>
        </div>
      `;
      card.classList.remove('hidden');
    }

    // Algoritmo Desglose Impermeabilizante
    function calcularImper() {
      const area = parseFloat(document.getElementById('iArea').value) || 0;
      const lineaVal = document.getElementById('lineaImper').value;
      const incSellador = document.getElementById('incSellador').checked;
      const incMalla = document.getElementById('incMalla').checked;
      const card = document.getElementById('resImperCard');
      const cont = document.getElementById('resImperCont');

      if (area <= 0) {
        alert('Por favor ingresa un área válida.');
        return;
      }

      const cubetaRend = 19; // 1 Cubeta 19L rinde 19m² a 2 manos (1 L/m²)
      const galonRend = 4;

      let m2Restantes = area;
      let cubetas = Math.floor(m2Restantes / cubetaRend);
      m2Restantes %= cubetaRend;

      let galones = 0;
      if (m2Restantes > 0) {
        galones = Math.ceil(m2Restantes / galonRend);
        if (galones >= 4) {
          cubetas += 1;
          galones = 0;
        }
      }

      // Sellador Acrílico (19L rinde 95 m²)
      let selladorCubetas = 0;
      let selladorGalones = 0;
      if (incSellador) {
        let sRest = area;
        selladorCubetas = Math.floor(sRest / 95);
        sRest %= 95;
        if (sRest > 0) {
          selladorGalones = Math.ceil(sRest / 20);
          if (selladorGalones >= 4) {
            selladorCubetas += 1;
            selladorGalones = 0;
          }
        }
      }

      // Malla (+10% traslape)
      const m2Malla = incMalla ? (area * 1.10).toFixed(1) : 0;

      let html = `
        <p class="text-xs text-slate-400 mb-1">Producto: <span class="text-white font-medium">Meridian ${lineaVal} Años</span></p>
        <p class="text-xs text-slate-400 mb-3">Superficie azotea: <span class="text-white font-medium">${area} m²</span></p>
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 space-y-2 text-xs">
          <div>
            <p class="text-slate-400 font-semibold">• Impermeabilizante:</p>
            <p class="text-emerald-400 font-bold text-sm">
              ${cubetas > 0 ? `${cubetas} Cubeta(s) 19L ` : ''}
              ${galones > 0 ? `${galones} Galón(es) 4L` : ''}
            </p>
          </div>
      `;

      if (incSellador) {
        html += `
          <div>
            <p class="text-slate-400 font-semibold">• Sellador Acrílico:</p>
            <p class="text-emerald-400 font-bold text-sm">
              ${selladorCubetas > 0 ? `${selladorCubetas} Cubeta(s) 19L ` : ''}
              ${selladorGalones > 0 ? `${selladorGalones} Galón(es) 4L` : ''}
            </p>
          </div>
        `;
      }

      if (incMalla) {
        html += `
          <div>
            <p class="text-slate-400 font-semibold">• Malla de Refuerzo:</p>
            <p class="text-emerald-400 font-bold text-sm">${m2Malla} m² (con 10% traslape)</p>
          </div>
        `;
      }

      html += `</div>`;
      cont.innerHTML = html;
      card.classList.remove('hidden');
    }
  </script>
</body>
</html>
