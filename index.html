<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Meridian</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 space-y-6">
    
    <!-- Encabezado -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold tracking-tight text-white">Calculadora Meridian</h1>
      <p class="text-xs text-slate-400">Herramienta de cubetaje y rendimiento en mostrador</p>
    </div>

    <!-- Selector de Pestañas (Tabs) -->
    <div class="grid grid-cols-2 gap-1 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
      <button id="tab-pintura" onclick="switchTab('pintura')" class="py-2 text-xs font-bold rounded-lg transition-all bg-blue-600 text-white shadow-md">Pintura</button>
      <button id="tab-imper" onclick="switchTab('imper')" class="py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">Impermeabilizante</button>
    </div>

    <!-- MÓDULO PINTURA -->
    <div id="modulo-pintura" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Por Dimensiones de Pared (m):</label>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="p-ancho" placeholder="Ancho (m)" oninput="calcPinturaArea()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          <input type="number" id="p-alto" placeholder="Alto (m)" oninput="calcPinturaArea()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">O Área Total de Superficie (m²):</label>
        <input type="number" id="p-area" placeholder="Ej. 45" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Línea de Pintura Meridian:</label>
        <select id="p-linea" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="10">Meridian Profesional / Vinílica (10 m²/L a 1 mano)</option>
          <option value="8">Meridian Clásica (8 m²/L a 1 mano)</option>
          <option value="6">Meridian Económica / Contrato (6 m²/L a 1 mano)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Manos requeridas:</label>
        <select id="p-manos" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="2" selected>2 Manos (Recomendado estándar)</option>
          <option value="1">1 Mano (Mantenimiento / Cambio leve)</option>
          <option value="3">3 Manos (Superficie porosa / Cambio drástico)</option>
        </select>
      </div>

      <button onclick="calcularPintura()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm shadow-lg shadow-blue-600/20 transition-all">Calcular Pintura</button>
    </div>

    <!-- MÓDULO IMPERMEABILIZANTE -->
    <div id="modulo-imper" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Por Dimensiones de Azotea (m):</label>
        <div class="grid grid-cols-2 gap-2">
          <input type="number" id="i-largo" placeholder="Largo (m)" oninput="calcImperArea()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          <input type="number" id="i-ancho" placeholder="Ancho (m)" oninput="calcImperArea()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">O Área Total de Azotea (m²):</label>
        <input type="number" id="i-area" placeholder="Ej. 100" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Línea Meridian Impermeabilizante:</label>
        <select id="i-linea" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="3">Meridian 3 Años (Cubeta 19L y Galón 4L)</option>
          <option value="7">Meridian 7 Años (Solo Cubeta 19L)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Preparación de Superficie (Primario / Sellador):</label>
        <select id="i-sellador-tipo" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="independiente">Sellador Acrílico Independiente (Cubeta / Galón)</option>
          <option value="mismo">Sellar con mismo Impermeabilizante (Diluido 1:4 con agua)</option>
          <option value="ninguno">Sin Sellador (Superficie ya preparada)</option>
        </select>
      </div>

      <div class="bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
        <label class="flex items-center space-x-2 text-xs text-slate-300 cursor-pointer">
          <input type="checkbox" id="i-malla" checked class="rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0">
          <span>Incluir Malla de Refuerzo (+10% traslape)</span>
        </label>
      </div>

      <button onclick="calcularImper()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm shadow-lg shadow-blue-600/20 transition-all">Calcular Sistema Impermeable</button>
    </div>

    <!-- CONTENEDOR DE RESULTADOS -->
    <div id="resultado" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
      <h3 class="text-xs font-bold uppercase tracking-wider text-blue-400" id="resultado-titulo">Desglose de Material</h3>
      <div id="resultado-detalles" class="space-y-2 text-sm text-slate-200"></div>
    </div>

  </div>

  <script>
    function switchTab(tab) {
      const modPintura = document.getElementById('modulo-pintura');
      const modImper = document.getElementById('modulo-imper');
      const btnPintura = document.getElementById('tab-pintura');
      const btnImper = document.getElementById('tab-imper');
      const divRes = document.getElementById('resultado');

      divRes.classList.add('hidden');

      if (tab === 'pintura') {
        modPintura.classList.remove('hidden');
        modImper.classList.add('hidden');
        btnPintura.className = "py-2 text-xs font-bold rounded-lg transition-all bg-blue-600 text-white shadow-md";
        btnImper.className = "py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
      } else {
        modPintura.classList.add('hidden');
        modImper.classList.remove('hidden');
        btnImper.className = "py-2 text-xs font-bold rounded-lg transition-all bg-blue-600 text-white shadow-md";
        btnPintura.className = "py-2 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
      }
    }

    function calcPinturaArea() {
      const a = parseFloat(document.getElementById('p-ancho').value) || 0;
      const h = parseFloat(document.getElementById('p-alto').value) || 0;
      if (a > 0 && h > 0) document.getElementById('p-area').value = (a * h).toFixed(2);
    }

    function calcImperArea() {
      const l = parseFloat(document.getElementById('i-largo').value) || 0;
      const a = parseFloat(document.getElementById('i-ancho').value) || 0;
      if (l > 0 && a > 0) document.getElementById('i-area').value = (l * a).toFixed(2);
    }

    function calcularPintura() {
      const area = parseFloat(document.getElementById('p-area').value);
      if (!area || area <= 0) return alert('Ingresa un área válida');

      const rendXlitro = parseFloat(document.getElementById('p-linea').value);
      const manos = parseInt(document.getElementById('p-manos').value);

      const litrosTotales = (area * manos) / rendXlitro;
      
      let cubetas = Math.floor(litrosTotales / 19);
      let restoLitros = litrosTotales % 19;
      let galones = 0;
      let litrosPuros = 0;

      if (restoLitros > 0) {
        galones = Math.floor(restoLitros / 4);
        restoLitros = restoLitros % 4;
        if (restoLitros > 0) {
          litrosPuros = Math.ceil(restoLitros);
          if (litrosPuros >= 4) {
            galones += 1;
            litrosPuros = 0;
          }
        }
        if (galones >= 4) {
          cubetas += 1;
          galones = 0;
        }
      }

      let empaqueStr = [];
      if (cubetas > 0) empaqueStr.push(`${cubetas} Cubeta(s) 19L`);
      if (galones > 0) empaqueStr.push(`${galones} Galón(es) 4L`);
      if (litrosPuros > 0) empaqueStr.push(`${litrosPuros} Bote(s) 1L`);

      let html = `<p class="text-xs text-slate-400">Área total: <b class="text-white">${area} m²</b> (${manos} manos)</p>`;
      html += `<p class="text-xs text-slate-400 mb-2">Litros netos calculados: <b class="text-white">${litrosTotales.toFixed(1)} L</b></p>`;
      html += `<div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
        <span class="text-xs font-semibold text-slate-300 block mb-1">Presentación sugerida:</span>
        <b class="text-blue-400 text-sm">${empaqueStr.join(' + ') || '1 Bote(s) 1L'}</b>
      </div>`;

      document.getElementById('resultado-titulo').innerText = 'Material de Pintura Requerido';
      document.getElementById('resultado-detalles').innerHTML = html;
      document.getElementById('resultado').classList.remove('hidden');
    }

    function calcularImper() {
      const area = parseFloat(document.getElementById('i-area').value);
      if (!area || area <= 0) return alert('Ingresa un área válida');

      const linea = document.getElementById('i-linea').value;
      const tipoSellador = document.getElementById('i-sellador-tipo').value;
      const incluirMalla = document.getElementById('i-malla').checked;

      let litrosPuros = area; 
      let notasSellador = '';

      if (tipoSellador === 'mismo') {
        const litrosPrimario = area / 20; 
        litrosPuros += litrosPrimario;
        notasSellador = `Incluye ${litrosPrimario.toFixed(1)}L extra para primario (diluido 1:4 con agua).`;
      }

      let cubetasImper = 0;
      let galonesImper = 0;

      if (linea === '3') {
        cubetasImper = Math.floor(litrosPuros / 19);
        const restoLitros = litrosPuros % 19;
        if (restoLitros > 0) {
          galonesImper = Math.ceil(restoLitros / 4);
          if (galonesImper >= 4) {
            cubetasImper += 1;
            galonesImper = 0;
          }
        }
      } else {
        cubetasImper = Math.ceil(litrosPuros / 19);
        galonesImper = 0;
      }

      let html = `<p class="text-xs text-slate-400 mb-2">Superficie de azotea: <b class="text-white">${area} m²</b></p><ul class="space-y-2">`;

      let textoEmpaque = '';
      if (cubetasImper > 0) textoEmpaque += `${cubetasImper} Cubeta(s) 19L`;
      if (galonesImper > 0) {
        if (textoEmpaque) textoEmpaque += ' + ';
        textoEmpaque += `${galonesImper} Galón(es) 4L`;
      }

      html += `<li class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
        <div class="flex justify-between items-center">
          <span class="text-xs font-semibold text-slate-300">Meridian ${linea} Años:</span> 
          <b class="text-blue-400 text-sm">${textoEmpaque}</b>
        </div>
        ${notasSellador ? `<p class="text-[11px] text-emerald-400 mt-1">${notasSellador}</p>` : ''}
      </li>`;

      if (tipoSellador === 'independiente') {
        let textoSellador = '';
        const cubetasSellador = Math.floor(area / 50);
        const restoAreaSellador = area % 50;
        let galonesSellador = 0;

        if (restoAreaSellador > 0) {
          galonesSellador = Math.ceil(restoAreaSellador / 10.5);
          if (galonesSellador >= 4) {
            textoSellador = `${cubetasSellador + 1} Cubeta(s) 19L`;
          } else if (cubetasSellador > 0) {
            textoSellador = `${cubetasSellador} Cubeta(s) 19L + ${galonesSellador} Galón(es) 4L`;
          } else {
            textoSellador = `${galonesSellador} Galón(es) 4L`;
          }
        } else {
          textoSellador = `${cubetasSellador} Cubeta(s) 19L`;
        }

        html += `<li class="flex justify-between items-center bg-slate-900/50 p-2 rounded border border-slate-800/80 text-xs text-slate-300">
          <span>Sellador Acrílico Independiente:</span> 
          <b class="text-emerald-400">${textoSellador}</b>
        </li>`;
      }

      if (incluirMalla) {
        const m2Malla = Math.ceil(area * 1.10);
        html += `<li class="flex justify-between items-center bg-slate-900/50 p-2 rounded border border-slate-800/80 text-xs text-slate-300">
          <span>Malla de Refuerzo:</span> 
          <b class="text-emerald-400">${m2Malla} m² (con 10% traslape)</b>
        </li>`;
      }

      html += `</ul><p class="text-[11px] text-slate-500 pt-2 border-t border-slate-800 mt-2">Rendimiento Meridian: 1 L/m² a 2 manos (19 m²/cubeta, 4 m²/galón).</p>`;

      document.getElementById('resultado-titulo').innerText = 'Sistema Impermeable Requerido';
      document.getElementById('resultado-detalles').innerHTML = html;
      document.getElementById('resultado').classList.remove('hidden');
    }
  </script>
</body>
</html>
